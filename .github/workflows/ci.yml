name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo-doctor
      # SOS state machine, PIN rules, phone parsing and the offline queue.
      # The state machine decides whether help is summoned; it must pass.
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Applies every migration to Postgres + PostGIS and checks row level
      # security as an owner, an invited responder and a stranger; also the
      # fan-out and relay cores against provider request formats.
      - run: npm test
      # Edge Functions typecheck under the Deno release Supabase runs.
      - run: npx --yes deno@2.9.6 check --node-modules-dir=none functions/sos-fanout/index.ts functions/sos-relay/index.ts
